# 자체 서버(가비아 클라우드 등)에서 백엔드 전체를 띄운다.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# 앱·DB·리버스 프록시 세 개다. 프록시(Caddy)가 인증서를 자동으로 받아 HTTPS를 붙인다.
# 프론트가 HTTPS(Vercel)라 백엔드가 HTTP면 브라우저가 요청을 막는다. TLS는 선택이 아니다.
#
# 비밀값은 이 파일에 적지 않는다. 서버의 deploy/.env 에 둔다 (커밋 대상 아님).

services:
  db:
    # pg_dump는 자기보다 높은 버전의 서버를 덤프하지 못한다. 옮겨올 DB보다
    # 낮은 버전을 쓰면 데이터 이전 자체가 막히므로 최신 메이저를 따라간다.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codetrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD를 넣으세요}
      POSTGRES_DB: ${POSTGRES_DB:-codetrace}
      # 18 이미지에는 /var/lib/postgresql/data 가 없다. 그대로 두면 볼륨이 root 소유
      # 빈 폴더로 생기고 postgres 사용자가 초기화하지 못해 컨테이너가 재시작을 반복한다.
      # 엔트리포인트가 직접 만드는 하위 폴더를 가리켜 소유권을 맞춘다.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 앱이 DB보다 먼저 떠서 연결 실패로 죽는 것을 막는다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codetrace}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너끼리는 서비스 이름으로 찾는다. 서버 밖으로 DB를 열지 않는다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-codetrace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-codetrace}
      PORT: 8000
    volumes:
      # 인덱싱이 레포를 클론해두는 곳. 컨테이너를 다시 만들어도 남는다.
      - clones:/app/local/clones

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 인증서를 받을 주소. deploy/.env 에 넣는다.
      DOMAIN: ${DOMAIN:?deploy/.env에 DOMAIN을 넣으세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  clones:
  caddy_data:
  caddy_config:
