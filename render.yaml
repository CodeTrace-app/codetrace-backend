services:
  - type: web
    name: codetrace-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codetrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # 아래 값들은 Render 대시보드에서 직접 입력한다 (레포에 남기지 않는다)
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_ORG_ID
        sync: false
      - key: LLM_MODEL
        sync: false
      # 설치 콜백이 사용자를 돌려보낼 주소. 없으면 localhost로 튕긴다.
      - key: FRONTEND_URL
        sync: false
      # GitHub App 인증. 비어 있으면 RS256 서명이 실패해 연동 API가 전부 500이 난다.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      # 개인키는 파일을 올릴 수 없으므로 내용을 그대로 넣는다.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

databases:
  - name: codetrace-db
    plan: free
    region: singapore
